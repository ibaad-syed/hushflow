name: "Main Branch Build"

# Runs the full cross-platform build on every push to main so breakage is
# caught before a manual release is triggered. Artifacts are kept for 30 days
# so any commit on main has a downloadable, testable build.

on:
  workflow_dispatch:
  push:
    branches: [main]
    # The website and docs don't change the app.
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "**.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Let a running build finish (it takes ~20 min); a newer push waits, and
  # only the newest waiting one runs.
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-26" # Apple Silicon; macOS 26 SDK for SpeechAnalyzer and Foundation Models.
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
          - platform: "windows-latest"
            args: ""
            target: "x86_64-pc-windows-msvc"

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      upload-artifacts: true
      # Releases sign and notarize; per-push builds skip it so they don't
      # wait on Apple's notarization queue.
      sign-binaries: false
    secrets: inherit
