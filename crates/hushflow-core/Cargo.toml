[package]
name = "hushflow-core"
version = "0.1.0"
description = "Platform-free Hushflow code shared by the desktop and mobile apps"
edition = "2021"
license = "MIT"
publish = false

[features]
# Derives specta::Type on the store's types, for tauri-specta bindings (the
# desktop's). Mobile doesn't need it.
specta = ["dep:specta"]

[dependencies]
anyhow = "1.0.95"
once_cell = "1"
regex = "1"
# Same versions as the desktop, so the two can share one SQLite build later.
rusqlite = { version = "0.37", features = ["bundled"] }
rusqlite_migration = "2.3"
serde = { version = "1", features = ["derive"] }
specta = { version = "=2.0.0-rc.22", features = ["derive"], optional = true }
strsim = "0.11.0"

[dev-dependencies]
tempfile = "3"
